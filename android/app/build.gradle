// TASK-180 (Android plan A2): the game app. One activity, GameActivity (SDL3's SDLActivity), in its own process
// (":game"), loading libSDL3.so and libgt4.so. The native libraries are built outside Gradle (android/native,
// configure-android.cmd) and staged into src/main/jniLibs by stage-native-libs.cmd; the SDL3 3.4.18 AAR (its Java
// classes) is staged into libs/. Neither is committed.
plugins {
    id "com.android.application"
}

android {
    namespace "io.github.moesuito.gt4recomp"
    compileSdk 36
    // The build-tools and NDK already installed here (the NDK strips the staged libraries); AGP would otherwise fetch its
    // own default versions.
    buildToolsVersion "36.1.0"
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "io.github.moesuito.gt4recomp"
        minSdk 29          // Android 10: Vulkan 1.1+ and AAudio on every device
        targetSdk 36
        versionCode 1
        versionName "0.1.0-android-a2"
        ndk {
            abiFilters "x86_64", "arm64-v8a"   // emulator, phones; only the staged ABIs end up in the APK
        }
    }

    buildTypes {
        debug {
            debuggable true    // adb run-as and logcat on test builds
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Stored uncompressed and page-aligned in the APK: loaded straight from it, 16 KB pages included.
            useLegacyPackaging false
        }
    }
}

dependencies {
    // SDL3 3.4.18, the official Android package (libsdl-org release-3.4.18, git 829a65d7), staged by stage-native-libs.cmd.
    implementation files("libs/SDL3-3.4.18.aar")
}
